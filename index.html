<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Ubicación</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header>
        <h1>Monitor de Rutas</h1>
    </header>

    <main>
        <div class="map-placeholder" id="map">
            <p>🗺️ El mapa interactivo se cargará en esta área</p>
        </div>

        <div class="controls-panel">
            <div class="status-container">
                <span>Estado actual:</span>
                <div class="status-indicator">
                    <span class="dot" id="statusDot"></span>
                    <span id="statusText">Sistema en espera</span>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn-start" id="btnStart">Iniciar Rastreo</button>
                <button class="btn-stop" id="btnStop">Detener</button>
            </div>
        </div>
    </main>

</body>
<script src="script.js"></script>
</html>
